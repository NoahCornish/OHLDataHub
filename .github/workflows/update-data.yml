name: Update OHL Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install OHLpkg
        run: |
          install.packages("remotes")
          remotes::install_github("NoahCornish/OHLpkg")
        shell: Rscript {0}

      - name: Update current OHL data
        run: Rscript scripts/update_current_all.R

      - name: Commit updated data
        run: |
          git config user.name "OHL Data Bot"
          git config user.email "actions@github.com"
          git add data/current/
          git diff --cached --quiet || git commit -m "Update current OHL data"
          git push
