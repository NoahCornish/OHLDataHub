name: Update OHL Data

on:
  workflow_dispatch:

  on:
  workflow_dispatch:

  schedule:
    - cron: "17 2,9,12,17,20,21,22 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install OHLpkg
        run: |
          git clone --depth 1 https://github.com/NoahCornish/OHLpkg.git /tmp/OHLpkg
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_deps("/tmp/OHLpkg", dependencies = TRUE)'
          R CMD INSTALL /tmp/OHLpkg

      - name: Update current OHL data
        run: Rscript scripts/update_current_data.R

      - name: Commit updated data
        run: |
          git config user.name "OHL Data Bot"
          git config user.email "actions@github.com"

          git add data/current/

          git diff --cached --quiet || git commit -m "Update current OHL data"

          git push
